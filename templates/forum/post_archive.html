{% load static %}
<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content forum-action-modal forum-action-modal--archive">
    <div class="forum-modal-heading">
        <span class="forum-modal-icon" aria-hidden="true"><i class="fa-solid fa-box-archive"></i></span>
        <div>
            <p class="forum-modal-kicker">Post management</p>
            <h2>Archive Post?</h2>
        </div>
    </div>
    <p class="forum-modal-intro">Do you want to archive this post?</p>

    <div class="forum-modal-content-title">
        <span>Discussion</span>
        <strong>"{{ post.title }}"</strong>
    </div>

    <form method="post" action="{% url 'forum:post_archive' post.pk %}" class="ajax-form" data-target="#global-modal" data-modal-form>
        {% csrf_token %}
        <div class="modal__actions">
            <button type="button" class="button secondary-button" data-close-modal>Cancel</button>
            <button type="submit" class="button button-danger"><i class="fa-solid fa-box-archive"></i> Archive Post</button>
        </div>
    </form>
</div>
