<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content forum-notifications-modal" role="document">
    <div class="modal__header">
        <div>
            <p class="eyebrow">Community activity</p>
            <h2 class="modal__title" id="global-modal-title">Forum Notifications</h2>
        </div>
        <button type="button" class="modal__close" data-close-modal aria-label="Close forum notifications">&times;</button>
    </div>

    <div class="modal__body">
        <div class="forum-notification-list">
            {% for item in activity %}
                <a href="{{ item.url }}" class="forum-notification-item">
                    <span class="forum-notification-icon" aria-hidden="true">
                        <i class="fa-solid fa-bell"></i>
                    </span>
                    <span class="forum-notification-copy">
                        <strong>{{ item.actor.get_full_name|default:item.actor.username }}</strong>
                        {{ item.message }}
                        <small>{{ item.created_at|timesince }} ago</small>
                    </span>
                    <i class="fa-solid fa-chevron-right forum-notification-arrow" aria-hidden="true"></i>
                </a>
            {% empty %}
                <div class="empty-state">
                    <i class="fa-regular fa-bell-slash" aria-hidden="true"></i>
                    <h3>No forum notifications yet</h3>
                    <p>Activity from your discussions will appear here.</p>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
