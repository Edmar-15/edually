<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content edit-post-container">
    <div class="edit-post-header">
        <h2>Edit Question</h2>
        <button type="button" class="modal-close" aria-label="Close edit dialog" data-close-modal>×</button>
    </div>
    <form method="post"
            action="{% url 'forum:post_edit' post.pk %}"
            class="post-edit-form ajax-form"
            data-target="#global-modal"
            data-replace="true"
            data-modal-form>
        {% csrf_token %}
        {% if form.errors %}
            <div class="form-error-summary">
                <ul>
                    {% for field in form %}
                        {% for error in field.errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    {% endfor %}
                    {% for error in form.non_field_errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
        <div class="form-field-wrapper">
            {{ form.as_p }}
        </div>
        <div class="modal__actions">
            <button type="submit" class="button primary-button button-lg">Save Changes</button>
            <button type="button" class="button secondary-button" data-close-modal>Cancel</button>
        </div>
    </form>
</div>
