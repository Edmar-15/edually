{% load static %}
<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content forum-action-modal forum-action-modal--report">
    <div class="forum-modal-heading">
        <span class="forum-modal-icon forum-modal-icon--report" aria-hidden="true"><i class="fa-solid fa-flag"></i></span>
        <div>
            <p class="forum-modal-kicker">Community safety</p>
            <h2>Report Content</h2>
        </div>
    </div>
    <p class="forum-modal-intro">Help us keep the forum safe. Tell us what needs review.</p>

        {% if error %}
            <div class="form-error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="post"
                action="{% url 'forum:flag_content' content_type content.pk %}"
                class="ajax-form"
                data-target="#global-modal"
                data-replace="true"
                data-close-modal="false"
                data-modal-form>
            {% csrf_token %}

            <div class="forum-modal-field">
                <label for="id_reason">Report category:</label>
                <select id="id_reason" name="reason" required>
                    <option value="">-- Select a category --</option>
                    {% for value, label in reason_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="forum-modal-field">
                <label for="id_description">Additional details (optional):</label>
                <textarea id="id_description" name="description" rows="4" placeholder="Provide any additional context..."></textarea>
            </div>

            <div class="modal__actions">
                <button type="button" class="button secondary-button" data-close-modal>Cancel</button>
                <button type="submit" class="button primary-button"><i class="fa-solid fa-paper-plane"></i> Submit Report</button>
            </div>
        </form>
</div>
