<!doctype html>
<html lang="en" {% block html_attrs %}{% endblock %}>
<head>
    {% load static %}
    <meta charset="utf-8">
    <title>{% block title %}EDUALLY{% endblock %}</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="theme-color" content="#0E9AA7">

    <!-- 1️⃣ Manifest -->
    <link rel="manifest" href="{% url 'manifest' %}">

    <!-- Optional iOS support -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">

    <link rel="shortcut icon" href="{% static "favicon.ico" %}" type="image/x-icon">
    <script>
        (function () {
            const html = document.documentElement;
            const key = 'eduallyDarkMode';
            const cookieName = 'eduallyTheme';

            function getCookie(name) {
                const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
                return match ? match.pop() : '';
            }

            let theme = 'light';
            const forcedTheme = html.dataset.forceTheme;
            if (forcedTheme === 'dark' || forcedTheme === 'light') {
                theme = forcedTheme;
            } else {
                try {
                    const saved = localStorage.getItem(key);
                    if (saved === 'dark' || saved === 'light') {
                        theme = saved;
                    }
                } catch (error) {
                    // ignore storage access errors
                }

                if (theme === 'light') {
                    const cookieTheme = getCookie(cookieName);
                    if (cookieTheme === 'dark' || cookieTheme === 'light') {
                        theme = cookieTheme;
                    }
                }
            }

            if (!theme || (theme !== 'dark' && theme !== 'light')) {
                theme = 'light';
            }

            html.classList.toggle('dark', theme === 'dark');
            html.dataset.theme = theme;
            html.style.colorScheme = theme;
        })();
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">

    <!-- Your regular CSS/JS (adjust paths) -->
    {% block extra_head %}{% endblock %}
</head>

<body>
    {% if messages %}
      <ul class="messages" aria-live="polite" style="display:none;">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block content %}{% endblock %}

    <!-- 2️⃣ Service‑worker registration -->
    <script>
        function urlBase64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            const outputArray = new Uint8Array(rawData.length);
            for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
            return outputArray;
        }

        function bytesToBase64(bytes) {
            return btoa(String.fromCharCode(...new Uint8Array(bytes)));
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js?v={{ PWA_SW_VERSION|default:"20260819" }}')
                .then(reg => {
                // If a new SW is waiting, tell it to activate now.
                if (reg.waiting) {
                    reg.waiting.postMessage({type: 'SKIP_WAITING'});
                }

                // Listen for future updates and apply them automatically.
                reg.addEventListener('updatefound', () => {
                    const newSW = reg.installing;
                    newSW.addEventListener('statechange', () => {
                    if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                        newSW.postMessage({type: 'SKIP_WAITING'});
                    }
                    });
                });
                });
            }

        {% if user.is_authenticated and VAPID_PUBLIC_KEY %}
        window.enablePushNotifications = async function () {
            if (!('PushManager' in window) || !('Notification' in window) || !('serviceWorker' in navigator)) {
                console.warn('Web Push is not supported in this browser.');
                return false;
            }

            if (!window.isSecureContext) {
                throw new Error('Push notifications require HTTPS or localhost');
            }

            if (Notification.permission === 'default') {
                const permission = await Notification.requestPermission();
                if (permission !== 'granted') {
                    if (permission === 'denied') {
                        throw new Error('Edge is blocking notifications for this site; allow localhost in Edge site permissions');
                    }
                    throw new Error('Edge did not grant notification permission; choose Allow in the browser prompt');
                }
            }

            if (Notification.permission === 'denied') {
                throw new Error('Edge is blocking notifications for this site; allow localhost in Edge site permissions');
            }

            const registration = await navigator.serviceWorker.ready;
            const existingSubscription = await registration.pushManager.getSubscription();
            if (existingSubscription) {
                await existingSubscription.unsubscribe();
            }

            const subscription = await registration.pushManager.subscribe({
                userVisibleOnly: true,
                applicationServerKey: urlBase64ToUint8Array('{{ VAPID_PUBLIC_KEY }}').buffer
            });

            const response = await fetch('{% url "account:api_push_subscribe" %}', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    endpoint: subscription.endpoint,
                    keys: {
                        p256dh: bytesToBase64(subscription.getKey('p256dh')),
                        auth: bytesToBase64(subscription.getKey('auth'))
                    }
                })
            });

            if (!response.ok) {
                await subscription.unsubscribe();
                return false;
            }

            return true;
        };
        {% endif %}
    </script>

    <script src="{% static 'js/theme.js' %}" defer></script>
    <script src="{% static 'js/toast_notifications.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
