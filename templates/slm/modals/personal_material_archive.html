<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content">
    <h2>{% if pm.is_archived %}Unarchive{% else %}Archive{% endif %} material</h2>
    <p>
        Are you sure you want to {% if pm.is_archived %}unarchive{% else %}archive{% endif %}
        <strong>{{ pm.title }}</strong>?
    </p>

    <form method="post"
          action="{% url 'slm:personalmaterial-archive' pm.id %}"
          data-modal-form>
        {% csrf_token %}
        <div class="modal__actions">
            <button type="submit" class="button-primary">
                {% if pm.is_archived %}Unarchive{% else %}Archive{% endif %}
            </button>
            <button type="button" class="button-plain" data-close-modal>Cancel</button>
        </div>
    </form>
</div>
