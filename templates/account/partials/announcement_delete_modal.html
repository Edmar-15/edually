{# account/partials/announcement_delete_modal.html #}
<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content">
    <h2>Delete announcement permanently</h2>
    <p>
        Are you sure you want to delete the announcement
        <strong>{{ announcement.title }}</strong>?
        This action cannot be undone.
    </p>

    <form method="post"
          action="{% url 'account:announcement_delete' announcement.id %}"
          data-modal-form>
        {% csrf_token %}
        <div class="modal__actions">
            <button type="submit" class="button-primary button--danger">
                Delete permanently
            </button>
            <button type="button" class="button-plain" data-close-modal>
                Cancel
            </button>
        </div>
    </form>
</div>
