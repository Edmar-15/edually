{# account/templates/account/archive_forum_post_delete_modal.html #}
<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content">
    <h2>Delete forum post permanently</h2>
    <p>
        Are you sure you want to delete the archived post
        <strong>{{ post.title|default:"(no title)" }}</strong>?
        This action cannot be undone.
    </p>

    <form method="post"
          action="{% url 'account:archive-forum-post-delete' post.id %}"
          data-modal-form>
        {% csrf_token %}
        <div class="modal__actions">
            <button type="submit"
                    class="button-primary button--danger">
                Delete permanently
            </button>
            <button type="button"
                    class="button-plain"
                    data-close-modal>
                Cancel
            </button>
        </div>
    </form>
</div>
