{% load static %}
<div class="modal__backdrop" data-close-modal></div>
<div class="modal__content announcement-modal">
    <header class="modal__header announcement-modal__header">
        <div class="announcement-modal__heading">
            <span class="announcement-modal__badge">Announcement</span>
            <h2 class="modal__title">{{ announcement.title }}</h2>
        </div>
        <button type="button" class="modal__close" data-close-modal aria-label="Close">&times;</button>
    </header>

    <section class="modal__body announcement-modal__body">
        <div class="announcement-modal__meta">
            <span><i class="fa-solid fa-user"></i> {{ announcement.author.get_full_name|default:announcement.author.email }}</span>
            <span><i class="fa-solid fa-clock"></i> {{ announcement.created_at|date:"M d, Y H:i" }}</span>
        </div>

        <div class="announcement-content announcement-modal__content">
            {{ announcement.content|linebreaks }}
        </div>
    </section>

    {% if request.user.is_teacher_member %}
    <footer class="modal__footer">
        <a href="#"
           class="button button-primary js-modal-trigger"
           data-url="{% url 'account:announcement_update_modal' announcement.id %}">Edit</a>

        <a href="#"
           class="button button--danger js-modal-trigger"
           data-url="{% url 'account:announcement_delete_modal' announcement.id %}">Delete</a>

        <button type="button" class="button-plain" data-close-modal>Close</button>
    </footer>
    {% else %}
    <footer class="modal__footer">
        <button type="button" class="button-plain" data-close-modal>Close</button>
    </footer>
    {% endif %}
</div>
