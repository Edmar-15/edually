<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f3f5f2">
    <title>{{ status_code }} | {{ title }} | EduAlly</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            color: #172c2b;
            background: #f3f5f2;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 2rem;
            background-image: linear-gradient(135deg, #f3f5f2 0%, #f3f5f2 68%, #e4efed 100%);
        }
        main {
            width: min(100%, 38rem);
            border-top: 5px solid #16877e;
            padding: clamp(2rem, 7vw, 4rem);
            background: #fff;
            box-shadow: 0 18px 55px rgb(23 44 43 / 9%);
        }
        .brand {
            margin: 0 0 3.5rem;
            color: #16877e;
            font-size: .9rem;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .code {
            margin: 0;
            color: #c4d8d4;
            font-size: 7rem;
            font-weight: 800;
            line-height: .9;
        }
        h1 {
            margin: 1.5rem 0 .75rem;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 2.2rem;
            font-weight: 500;
        }
        .message {
            max-width: 28rem;
            margin: 0;
            color: #52615e;
            font-size: 1.05rem;
            line-height: 1.7;
        }
        a {
            display: inline-block;
            margin-top: 2rem;
            padding: .8rem 1.1rem;
            background: #176f68;
            color: #fff;
            font-size: .95rem;
            font-weight: 700;
            text-decoration: none;
        }
        a:hover, a:focus-visible { background: #10554f; }
        a:focus-visible { outline: 3px solid #e6a23c; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="brand">EduAlly</p>
        <p class="code" aria-hidden="true">{{ status_code }}</p>
        <h1>{{ title }}</h1>
        <p class="message">{{ message }}</p>
        <a href="/">Return to home</a>
    </main>
</body>
</html>
